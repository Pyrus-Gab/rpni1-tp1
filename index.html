<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <link
            rel="stylesheet"
            href="style.css"
        />
        <script
            src="js/menu.js"
            defer
        ></script>
        <title>Foulée - Accueil</title>
    </head>
    <body>
        <header>
            <p class="titre-header">Foulée</p>
            <nav
                class="nav-menu"
                aria-label="Navigation principale"
            >
                <!-- Bouton Menu / Fermer -->
                <button
                    class="nav-menu__toggle"
                    aria-expanded="false"
                    aria-controls="nav-menu-list"
                    aria-label="Ouvrir le menu de navigation"
                >
                    <!-- L'icône doit être positionnée en premier pour le sélecteur CSS adjacent (+) -->
                    <span
                        class="nav-menu__hamburger-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="nav-menu__libelle">Menu</span>
                </button>

                <!-- Liste des liens de navigation -->
                <ul
                    id="nav-menu-list"
                    class="nav-menu__list"
                >
                    <li class="nav-menu__item">
                        <a
                            href="#hommes"
                            class="nav-menu__link"
                            >Hommes</a
                        >
                    </li>
                    <li class="nav-menu__item">
                        <a
                            href="#femmes"
                            class="nav-menu__link"
                            >Femmes</a
                        >
                    </li>
                    <li class="nav-menu__item">
                        <a
                            href="#enfant"
                            class="nav-menu__link"
                            >Enfant</a
                        >
                    </li>
                    <li class="nav-menu__item">
                        <a
                            href="#sport"
                            class="nav-menu__link"
                            >Sport</a
                        >
                    </li>
                    <li class="nav-menu__item">
                        <a
                            href="#personnaliser"
                            class="nav-menu__link"
                            >Personnaliser</a
                        >
                    </li>
                    <li class="nav-menu__item">
                        <a
                            href="#fouleeplus"
                            class="nav-menu__link"
                            >Foulée +</a
                        >
                    </li>
                </ul>
                <form>
                    <label for="recherche">Rechercher</label>
                    <input
                        type="search"
                        id="recherche"
                    />
                </form>
                <a
                    class="nav_link"
                    href="#"
                    >Panier</a
                >
            </nav>
        </header>
        <main>
            <nav
                aria-label="Fil d'Ariane"
                class="fil"
            >
                <li>
                    <a
                        href="index.html"
                        aria-current="page"
                        >Accueil</a
                    >
                </li>
                <li><a href="#">Chaussures</a></li>
            </nav>
            <style>
                /* Pour le fil d'ariane */
                /* Conteneur principal */
                .fil {
                    padding: 10px 0;
                    font-family:
                        system-ui,
                        -apple-system,
                        sans-serif;
                    font-size: 0.9rem;
                }

                /* Liste des liens */
                .fil ul {
                    display: flex;
                    flex-wrap: wrap; /* Permet le retour à la ligne sur mobile */
                    list-style: none;
                    padding: 0;
                    margin: 0;
                }

                /* Éléments de la liste */
                .fil li {
                    display: flex;
                    align-items: center;
                }

                /* Séparateur visuel (ignoré par les lecteurs d'écran) */
                .fil li:not(:last-child)::after {
                    content: "/";
                    margin: 0 12px;
                    color: #a0aec0; /* Gris clair */
                    font-weight: 300;
                }

                /* Style des liens cliquables */
                .fil a {
                    color: #4a5568; /* Gris foncé text */
                    text-decoration: none;
                    transition: color 0.2s ease;
                }

                /* Effet au survol des liens */
                .fil a:hover {
                    color: #1a202c; /* Presque noir */
                    text-decoration: underline;
                }

                /* Style de la page actuelle (élément actif) */
                .fil [aria-current="page"] {
                    color: #718096; /* Gris neutre intermédiaire */
                    font-weight: 500;
                    pointer-events: none; /* Désactive le clic sur la page active */
                    text-decoration: none;
                }
            </style>
            <h1 class="titre-page">Chaussures</h1>
            <p class="nombre-produit">12 produits</p>
            <form>
                <button class="bouton-tous">Tous</button>
                <button class="bouton-hommes">Hommes</button>
                <button class="bouton-femmes">Femmes</button>
                <button class="bouton-enfants">Enfants</button>
            </form>
            <div class="catalogue">
                <div class="catalogue_mask-filtres">
                    <form>
                        <button
                            type="button"
                            id="btn-toggle-form"
                            class="mask-filtres"
                            aria-controls="filters"
                            aria-expanded="true"
                        >
                            Masquer les filtres
                        </button>
                        <label class="tier">Trier par</label>
                        <select
                            class="selecteur"
                            name="tri"
                        >
                            <option value="nouveautés">Nouveautés</option>
                            <option value="pop">Populaire</option>
                            <option value="alphabet">Alphabétique</option>
                        </select>
                    </form>
                </div>
                <form id="filtres">
                    <ul class="list-filtres">
                        <li class="filtres_item">
                            <details>
                                <summary>Sport</summary>
                                <ul class="filtres_sub-liste">
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="course"
                                            type="checkbox"
                                        />
                                        <label for="course">Course</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="basketball"
                                            type="checkbox"
                                        />
                                        <label for="basketball">Basketball</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="football"
                                            type="checkbox"
                                        />
                                        <label for="football">Football</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="training"
                                            type="checkbox"
                                        />
                                        <label for="training">Training</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="lifestyle"
                                            type="checkbox"
                                        />
                                        <label for="lifestyle">Lifestyle</label>
                                    </li>
                                </ul>
                            </details>
                        </li>
                        <li class="filtres_item">
                            <details>
                                <summary>Prix</summary>
                                <ul class="filtres_sub-liste">
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="-80"
                                            type="checkbox"
                                        />
                                        <label for="-80">Moins de 80 $</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="80-120"
                                            type="checkbox"
                                        />
                                        <label for="80-120">80 $ - 120 $</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="120-180"
                                            type="checkbox"
                                        />
                                        <label for="120-180">120 $ - 180 $</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="+180"
                                            type="checkbox"
                                        />
                                        <label for="+180">Plus de 180 $</label>
                                    </li>
                                </ul>
                            </details>
                        </li>
                        <li class="filtres_item">
                            <details>
                                <summary>Couleur</summary>
                                <ul class="filtres_sub-liste">
                                    <li class="filtres-couleur_item">
                                        <input
                                            id="blanc"
                                            type="checkbox"
                                        />
                                        <label for="blanc">Blanc</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="noir"
                                            type="checkbox"
                                        />
                                        <label for="noir">Noir</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="rouge"
                                            type="checkbox"
                                        />
                                        <label for="rouge">Rouge</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="bleu"
                                            type="checkbox"
                                        />
                                        <label for="bleu">Bleu</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="jaune"
                                            type="checkbox"
                                        />
                                        <label for="jaune">Jaune</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="gris"
                                            type="checkbox"
                                        />
                                        <label for="gris">Gris</label>
                                    </li>
                                </ul>
                            </details>
                        </li>
                        <li class="filtres_item">
                            <details>
                                <summary>Pointure</summary>
                                <ul class="filtres_sub-liste">
                                    <li class="filtres-couleur_item">
                                        <input
                                            id="36"
                                            type="checkbox"
                                        />
                                        <label for="36">36</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="37"
                                            type="checkbox"
                                        />
                                        <label for="37">37</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="38"
                                            type="checkbox"
                                        />
                                        <label for="38">38</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="39"
                                            type="checkbox"
                                        />
                                        <label for="39">39</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="40"
                                            type="checkbox"
                                        />
                                        <label for="40">40</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="41"
                                            type="checkbox"
                                        />
                                        <label for="41">41</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="42"
                                            type="checkbox"
                                        />
                                        <label for="42">42</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="43"
                                            type="checkbox"
                                        />
                                        <label for="43">43</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="44"
                                            type="checkbox"
                                        />
                                        <label for="44">44</label>
                                    </li>
                                    <li class="filtres_sub-liste-item">
                                        <input
                                            id="45"
                                            type="checkbox"
                                        />
                                        <label for="45">45</label>
                                    </li>
                                </ul>
                            </details>
                        </li>
                    </ul>
                </form>
                <script>
                    var toggleBtn = document.getElementById("btn-toggle-form");
                    var filterForm = document.getElementById("filtres");

                    toggleBtn.addEventListener("click", function () {
                        var currentAttribute = toggleBtn.getAttribute("aria-expanded");

                        if (currentAttribute === "true") {
                            toggleBtn.setAttribute("aria-expanded", "false");
                            toggleBtn.textContent = "Afficher les filtres";
                            filterForm.classList.add("is-hidden");
                        } else {
                            toggleBtn.setAttribute("aria-expanded", "true");
                            toggleBtn.textContent = "Masquer les filtres";
                            filterForm.classList.remove("is-hidden");
                        }
                    });
                </script>
                <style>
                    /* Masquage accessible du formulaire entier */
                    .is-hidden {
                        display: none;
                    }

                    /* Style des deux listes */
                    .filter-list {
                        list-style: none;
                        padding: 0;
                        margin: 0 0 20px 0;
                    }

                    .filter-list li {
                        margin: 8px 0;
                    }

                    .section-title {
                        font-weight: bold;
                        font-size: 1.1em;
                    }

                    .list-option {
                        padding-left: 15px;
                    }

                    button {
                        padding: 6px 12px;
                        cursor: pointer;
                        margin-bottom: 12px;
                    }
                </style>
                <div class="grille-articles">
                    <ul>
                        <li>
                            <div>
                                
                            </div>
                        </li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
            </div>
        </main>
    </body>
</html>
